<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ======================================== -->
  <!--       ADD THE 'RS' TAB ICON HERE       -->
  <!-- ======================================== -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- THE NAME ON THE TAB -->
  <title>Rina Sloane | Author</title>

  <!-- (Rest of your code, Font Awesome and <style> block, remains below) -->
  
  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Centered Book Cover */
    .hero {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      margin: auto;
    }

    /* Fixed Upper-Right Social Links */
    .social-links {
      position: fixed !important;
      top: 24px !important;
      right: 28px !important;
      bottom: auto !important;
      left: auto !important;
      width: auto !important;
      
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 22px !important;
      z-index: 99999 !important;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 24px;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-links a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Floating 'Coming Soon' Badge */
    .coming-soon {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;

      padding: 10px 24px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Mobile screens */
    @media (max-width: 600px) {
      .social-links {
        top: 16px !important;
        right: 16px !important;
        gap: 16px !important;
      }
      .social-links a {
        font-size: 20px;
      }
      .coming-soon {
        bottom: 20px;
        font-size: 11px;
        letter-spacing: 2.5px;
        padding: 8px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Cover Art -->
  <img
    src="assets/cover.jpg"
    alt="Cover image"
    class="hero"
    width="1600"
    height="2560"
  />

  <!-- Upper Right Social Icons -->
  <div class="social-links">
    <a
      href="https://www.instagram.com/rinasloane"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a
      href="https://www.facebook.com/rinasloaneauthor"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
    >
      <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a
      href="https://www.threads.net/@rinasloane"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Threads"
    >
      <i class="fa-brands fa-threads"></i>
    </a>
  </div>

  <!-- Bottom Floating Badge -->
  <div class="coming-soon">Coming Soon</div>

</body>
</html>
