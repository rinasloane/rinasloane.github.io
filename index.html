<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rina Sloane</title>
  
  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Centered Book Cover with Black Letterboxing */
    .hero {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      margin: auto;
    }

    /* Fixed Upper-Right Social Links */
    .social-links {
      position: fixed !important;
      top: 24px !important;
      right: 28px !important;
      bottom: auto !important;
      left: auto !important;
      width: auto !important;
      
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 22px !important;
      z-index: 99999 !important;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 24px;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-links a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Mobile screens */
    @media (max-width: 600px) {
      .social-links {
        top: 16px !important;
        right: 16px !important;
        gap: 16px !important;
      }
      .social-links a {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <img
    src="assets/cover.jpg"
    alt="Cover image"
    class="hero"
    width="1600"
    height="2560"
  />

  <div class="social-links">
    <a
      href="https://www.instagram.com/rinasloane"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a
      href="https://www.facebook.com/rinasloaneauthor"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
    >
      <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a
      href="https://www.threads.net/@rinasloane"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Threads"
    >
      <i class="fa-brands fa-threads"></i>
    </a>
  </div>

</body>
</html>
