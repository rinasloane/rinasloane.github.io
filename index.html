<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rina Sloane | Author</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=5">

  <!-- Font Awesome CDN -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Full-screen wrapper layout */
    .page-wrapper {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }

    /* Top Navigation Bar: Badge Left, Icons Right */
    .header-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }

    .coming-soon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 999px;
      white-space: nowrap;
      user-select: none;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-links a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Main Center Area: Book Cover */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 0;
    }

    .hero {
      display: block;
      width: auto;
      height: auto;
      max-width: min(84vw, 480px);
      max-height: calc(100dvh - 140px);
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.15);
      opacity: 0;
      animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Keyframes */
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Mobile screens adjustments */
    @media (max-width: 600px) {
      .header-bar {
        padding: 0 4px;
      }

      .coming-soon {
        font-size: 9px;
        letter-spacing: 1.5px;
        padding: 5px 12px;
      }

      .social-links {
        gap: 16px;
      }

      .social-links a {
        font-size: 18px;
      }

      .hero {
        max-width: 82vw;
        max-height: calc(100dvh - 120px);
      }
    }

    /* Very small phones (e.g. iPhone SE) */
    @media (max-width: 360px) {
      .coming-soon {
        font-size: 8px;
        padding: 4px 10px;
        letter-spacing: 1px;
      }
      .social-links {
        gap: 12px;
      }
      .social-links a {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Header -->
    <header class="header-bar">
      <div class="coming-soon">Coming Soon</div>

      <nav class="social-links" aria-label="Social links">
        <a href="https://www.instagram.com/rinasloane" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/rinasloaneauthor" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://www.threads.net/@rinasloane" target="_blank" rel="noopener noreferrer" aria-label="Threads">
          <i class="fa-brands fa-threads"></i>
        </a>
      </nav>
    </header>

    <!-- Book Hero -->
    <main class="main-content">
      <img
        src="assets/cover.jpg"
        alt="Every Lie That Held Me by Rina Sloane"
        class="hero"
      />
    </main>
  </div>

</body>
</html>
