<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rina Sloane | Author</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=5">

  <!-- Font Awesome CDN -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Layout Wrapper */
    .page-wrapper {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      padding: max(20px, env(safe-area-inset-top)) 
               max(24px, env(safe-area-inset-right)) 
               max(20px, env(safe-area-inset-bottom)) 
               max(24px, env(safe-area-inset-left));
    }

    /* Header Bar */
    .header-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }

    .coming-soon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 200, 100, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 999px;
      white-space: nowrap;
      user-select: none;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .social-links a:hover {
      color: #ffc266;
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Main Area & Amber Ambient Backlight */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 16px 0;
      position: relative;
    }

    /* Large Amber Glow Aura */
    .main-content::before {
      content: "";
      position: absolute;
      width: 90vw;
      max-width: 750px;
      height: 85vh;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 185, 75, 0.38) 0%,
        rgba(255, 120, 20, 0.22) 40%,
        rgba(0, 0, 0, 0) 72%
      );
      filter: blur(60px);
      -webkit-filter: blur(60px);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      animation: glowPulse 5s ease-in-out infinite alternate, fadeIn 1.2s ease-out 0.4s forwards;
    }

    /* Centered Book Cover with Amber Edge Illumination */
    .hero {
      display: block;
      position: relative;
      z-index: 2;
      width: auto;
      height: calc(100dvh - 120px);
      max-height: calc(100dvh - 120px);
      max-width: 90vw;
      object-fit: contain;
      border-radius: 4px;
      
      /* Multi-layer amber ambient glow */
      box-shadow: 
        0 0 35px rgba(255, 205, 110, 0.35),
        0 0 80px rgba(255, 140, 30, 0.45),
        0 20px 50px rgba(0, 0, 0, 0.95);

      opacity: 0;
      animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Keyframes */
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes glowPulse {
      0% {
        transform: scale(0.94);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      .header-bar {
        padding: 0 4px;
      }

      .coming-soon {
        font-size: 9px;
        letter-spacing: 1.5px;
        padding: 5px 12px;
      }

      .social-links {
        gap: 16px;
      }

      .social-links a {
        font-size: 18px;
      }

      .main-content::before {
        width: 100vw;
        height: 60vh;
        filter: blur(40px);
        -webkit-filter: blur(40px);
      }

      .hero {
        width: auto;
        height: auto;
        max-width: 86vw;
        max-height: calc(100dvh - 130px);
        box-shadow: 
          0 0 25px rgba(255, 205, 110, 0.4),
          0 0 60px rgba(255, 140, 30, 0.5),
          0 15px 35px rgba(0, 0, 0, 0.9);
      }
    }

    @media (max-width: 360px) {
      .coming-soon {
        font-size: 8px;
        padding: 4px 10px;
        letter-spacing: 1px;
      }

      .social-links {
        gap: 12px;
      }

      .social-links a {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Header -->
    <header class="header-bar">
      <div class="coming-soon">Coming Soon</div>

      <nav class="social-links" aria-label="Social links">
        <a href="https://www.instagram.com/rinasloane" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/rinasloaneauthor" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://www.threads.net/@rinasloane" target="_blank" rel="noopener noreferrer" aria-label="Threads">
          <i class="fa-brands fa-threads"></i>
        </a>
      </nav>
    </header>

    <!-- Center Hero -->
    <main class="main-content">
      <img
        src="assets/cover.jpg"
        alt="Every Lie That Held Me by Rina Sloane"
        class="hero"
      />
    </main>
  </div>

</body>
</html>
